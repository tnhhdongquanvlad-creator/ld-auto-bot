name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master, thu-nghiem ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onedir --noconsole --uac-admin --name LD_Auto_Bot ld_bot.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: LD_Auto_Bot
          path: dist/LD_Auto_Bot

      - name: Zip exe
        run: Compress-Archive -Path dist/LD_Auto_Bot -DestinationPath LD_Auto_Bot.zip

      - name: Publish release (link tai co dinh, khong can dang nhap)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            TAG=latest; EXTRA="--latest"; TITLE="LD Auto Bot - ban moi nhat"
          else
            TAG="$GITHUB_REF_NAME"; EXTRA="--prerelease"; TITLE="LD Auto Bot - ban thu nghiem ($GITHUB_REF_NAME)"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" LD_Auto_Bot.zip --target "$GITHUB_SHA" --title "$TITLE" $EXTRA --notes "Giai nen, chep de LD_Auto_Bot.exe va thu muc _internal vao thu muc app cu. Giu nguyen templates, workflow.json, config.json."
